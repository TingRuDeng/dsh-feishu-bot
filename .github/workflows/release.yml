name: Release RC

permissions: {}

on:
  push:
    tags:
      - 'v*-rc.*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      package_name: ${{ steps.contract.outputs.package_name }}
      version: ${{ steps.contract.outputs.version }}
      tag: ${{ steps.contract.outputs.tag }}
      tarball: ${{ steps.contract.outputs.tarball }}
      tarball_sha256: ${{ steps.contract.outputs.tarball_sha256 }}
      tarball_integrity: ${{ steps.contract.outputs.tarball_integrity }}
      checksums: ${{ steps.contract.outputs.checksums }}
      checksums_sha256: ${{ steps.contract.outputs.checksums_sha256 }}
      sbom: ${{ steps.contract.outputs.sbom }}
      sbom_sha256: ${{ steps.contract.outputs.sbom_sha256 }}
      descriptor_sha256: ${{ steps.contract.outputs.descriptor_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: dsh-feishu-bot
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: deepseek-ai/deepseek-harness
          ref: 47f943859bef60e4160492346772ded9b24f765a
          path: deepseek-harness
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
      - name: Pin package managers
        run: |
          corepack enable
          corepack prepare pnpm@11.18.0 --activate
          npm install --global npm@11.16.0
      - name: Build Harness host libraries
        working-directory: deepseek-harness
        run: |
          pnpm install --frozen-lockfile
          pnpm build:lib:host
      - name: Build the sole formal tarball
        working-directory: dsh-feishu-bot
        env:
          DSH_RELEASE_ARTIFACT_DIR: ${{ github.workspace }}/formal-artifacts
          DSH_RELEASE_HARNESS_ROOT: ${{ github.workspace }}/deepseek-harness
          DSH_RELEASE_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: pnpm release:formal
      - name: Verify and describe formal artifacts
        id: contract
        env:
          ARTIFACT_DIR: ${{ github.workspace }}/formal-artifacts
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs'
          import { createHash } from 'node:crypto'
          import { basename, join } from 'node:path'

          const descriptorPath = join(process.env.ARTIFACT_DIR, 'release.json')
          const descriptor = JSON.parse(readFileSync(descriptorPath, 'utf8'))
          const fail = message => { throw new Error(message) }
          const fileHash = path => createHash('sha256').update(readFileSync(path)).digest('hex')
          const safeName = (value, label) => {
            if (typeof value !== 'string' || value === '' || basename(value) !== value) fail(`invalid ${label}`)
            return value
          }

          const tarball = safeName(descriptor?.artifacts?.tarball?.filename, 'tarball filename')
          const checksums = safeName(descriptor?.artifacts?.checksums?.filename, 'checksum filename')
          const sbom = safeName(descriptor?.artifacts?.sbom?.filename, 'SBOM filename')
          if (descriptor.publishable !== true) fail('formal descriptor is not publishable')
          if (descriptor?.source?.repository !== process.env.GITHUB_REPOSITORY) fail('descriptor repository mismatch')
          if (descriptor?.source?.gitSha !== process.env.GITHUB_SHA) fail('descriptor Git SHA mismatch')
          if (descriptor?.source?.tag !== process.env.GITHUB_REF_NAME) fail('descriptor tag mismatch')
          if (descriptor?.source?.workflow !== '.github/workflows/release.yml') fail('descriptor workflow mismatch')
          if (`v${descriptor?.package?.version}` !== descriptor.source.tag) fail('descriptor version mismatch')
          if (checksums !== 'SHA256SUMS') fail('unexpected checksum filename')

          const tarballHash = fileHash(join(process.env.ARTIFACT_DIR, tarball))
          const checksumsHash = fileHash(join(process.env.ARTIFACT_DIR, checksums))
          const sbomHash = fileHash(join(process.env.ARTIFACT_DIR, sbom))
          if (tarballHash !== descriptor.artifacts.tarball.sha256) fail('tarball SHA-256 mismatch')
          if (checksumsHash !== descriptor.artifacts.checksums.sha256) fail('checksum file SHA-256 mismatch')
          if (sbomHash !== descriptor.artifacts.sbom.sha256) fail('SBOM SHA-256 mismatch')
          if (readFileSync(join(process.env.ARTIFACT_DIR, checksums), 'utf8') !== `${tarballHash}  ${tarball}\n`) {
            fail('checksum content mismatch')
          }

          const outputs = {
            package_name: descriptor.package.name,
            version: descriptor.package.version,
            tag: descriptor.source.tag,
            tarball,
            tarball_sha256: tarballHash,
            tarball_integrity: descriptor.artifacts.tarball.integrity,
            checksums,
            checksums_sha256: checksumsHash,
            sbom,
            sbom_sha256: sbomHash,
            descriptor_sha256: fileHash(descriptorPath),
          }
          for (const [name, value] of Object.entries(outputs)) {
            if (typeof value !== 'string' || value.includes('\n') || value.includes('\r')) fail(`invalid output ${name}`)
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `${Object.entries(outputs).map(([key, value]) => `${key}=${value}`).join('\n')}\n`)
          NODE
      - name: Upload verified formal artifacts
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: formal-${{ github.ref_name }}
          path: |
            ${{ github.workspace }}/formal-artifacts/${{ steps.contract.outputs.tarball }}
            ${{ github.workspace }}/formal-artifacts/${{ steps.contract.outputs.checksums }}
            ${{ github.workspace }}/formal-artifacts/${{ steps.contract.outputs.sbom }}
            ${{ github.workspace }}/formal-artifacts/release.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  build_attest:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      package_name: ${{ needs.build.outputs.package_name }}
      version: ${{ needs.build.outputs.version }}
      tag: ${{ needs.build.outputs.tag }}
      tarball: ${{ needs.build.outputs.tarball }}
      tarball_sha256: ${{ needs.build.outputs.tarball_sha256 }}
      tarball_integrity: ${{ needs.build.outputs.tarball_integrity }}
      checksums: ${{ needs.build.outputs.checksums }}
      checksums_sha256: ${{ needs.build.outputs.checksums_sha256 }}
      sbom: ${{ needs.build.outputs.sbom }}
      sbom_sha256: ${{ needs.build.outputs.sbom_sha256 }}
      descriptor_sha256: ${{ needs.build.outputs.descriptor_sha256 }}
      provenance_bundle_sha256: ${{ steps.payload.outputs.provenance_bundle_sha256 }}
      sbom_bundle_sha256: ${{ steps.payload.outputs.sbom_bundle_sha256 }}
    steps:
      - name: Reject release workflow reruns
        env:
          CURRENT_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          if [ "$CURRENT_RUN_ATTEMPT" != "1" ]; then
            echo 'release workflow reruns are not allowed; create a new RC tag' >&2
            exit 1
          fi
      - name: Download verified formal artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: ${{ github.workspace }}/formal-artifacts
          merge-multiple: true
      - name: Verify artifacts before granting attestation authority
        env:
          ARTIFACT_DIR: ${{ github.workspace }}/formal-artifacts
          TARBALL: ${{ needs.build.outputs.tarball }}
          TARBALL_SHA256: ${{ needs.build.outputs.tarball_sha256 }}
          CHECKSUMS: ${{ needs.build.outputs.checksums }}
          CHECKSUMS_SHA256: ${{ needs.build.outputs.checksums_sha256 }}
          SBOM: ${{ needs.build.outputs.sbom }}
          SBOM_SHA256: ${{ needs.build.outputs.sbom_sha256 }}
          DESCRIPTOR_SHA256: ${{ needs.build.outputs.descriptor_sha256 }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, readdirSync } from 'node:fs'
          import { createHash } from 'node:crypto'
          import { join } from 'node:path'

          const expected = new Map([
            [process.env.TARBALL, process.env.TARBALL_SHA256],
            [process.env.CHECKSUMS, process.env.CHECKSUMS_SHA256],
            [process.env.SBOM, process.env.SBOM_SHA256],
            ['release.json', process.env.DESCRIPTOR_SHA256],
          ])
          const actual = readdirSync(process.env.ARTIFACT_DIR).sort()
          const names = [...expected.keys()].sort()
          if (actual.length !== names.length || actual.some((name, index) => name !== names[index])) {
            throw new Error(`formal artifact set is not exact: ${actual.join(', ')}`)
          }
          for (const [name, digest] of expected) {
            const actualDigest = createHash('sha256')
              .update(readFileSync(join(process.env.ARTIFACT_DIR, name)))
              .digest('hex')
            if (actualDigest !== digest) throw new Error(`formal artifact digest mismatch: ${name}`)
          }
          NODE
      - name: Attest build provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ github.workspace }}/formal-artifacts/${{ needs.build.outputs.tarball }}
            ${{ github.workspace }}/formal-artifacts/${{ needs.build.outputs.checksums }}
            ${{ github.workspace }}/formal-artifacts/${{ needs.build.outputs.sbom }}
            ${{ github.workspace }}/formal-artifacts/release.json
      - name: Attest CycloneDX SBOM
        id: sbom_attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ github.workspace }}/formal-artifacts/${{ needs.build.outputs.tarball }}
          predicate-type: https://cyclonedx.org/bom
          predicate-path: ${{ github.workspace }}/formal-artifacts/${{ needs.build.outputs.sbom }}
      - name: Verify GitHub attestation identity and subjects
        env:
          ARTIFACT_DIR: ${{ github.workspace }}/formal-artifacts
          TARBALL: ${{ needs.build.outputs.tarball }}
          CHECKSUMS: ${{ needs.build.outputs.checksums }}
          SBOM: ${{ needs.build.outputs.sbom }}
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.sbom_attestation.outputs.bundle-path }}
          SIGNER_WORKFLOW: ${{ github.repository }}/.github/workflows/release.yml
        run: |
          set -euo pipefail
          gh attestation verify "$ARTIFACT_DIR/$TARBALL" \
            --repo "$GITHUB_REPOSITORY" \
            --bundle "$PROVENANCE_BUNDLE" \
            --signer-workflow "$SIGNER_WORKFLOW" \
            --signer-digest "$GITHUB_SHA" \
            --source-ref "$GITHUB_REF" \
            --source-digest "$GITHUB_SHA" \
            --deny-self-hosted-runners
          gh attestation verify "$ARTIFACT_DIR/$CHECKSUMS" \
            --repo "$GITHUB_REPOSITORY" \
            --bundle "$PROVENANCE_BUNDLE" \
            --signer-workflow "$SIGNER_WORKFLOW" \
            --signer-digest "$GITHUB_SHA" \
            --source-ref "$GITHUB_REF" \
            --source-digest "$GITHUB_SHA" \
            --deny-self-hosted-runners
          gh attestation verify "$ARTIFACT_DIR/$SBOM" \
            --repo "$GITHUB_REPOSITORY" \
            --bundle "$PROVENANCE_BUNDLE" \
            --signer-workflow "$SIGNER_WORKFLOW" \
            --signer-digest "$GITHUB_SHA" \
            --source-ref "$GITHUB_REF" \
            --source-digest "$GITHUB_SHA" \
            --deny-self-hosted-runners
          gh attestation verify "$ARTIFACT_DIR/release.json" \
            --repo "$GITHUB_REPOSITORY" \
            --bundle "$PROVENANCE_BUNDLE" \
            --signer-workflow "$SIGNER_WORKFLOW" \
            --signer-digest "$GITHUB_SHA" \
            --source-ref "$GITHUB_REF" \
            --source-digest "$GITHUB_SHA" \
            --deny-self-hosted-runners
          gh attestation verify "$ARTIFACT_DIR/$TARBALL" \
            --repo "$GITHUB_REPOSITORY" \
            --bundle "$SBOM_BUNDLE" \
            --predicate-type https://cyclonedx.org/bom \
            --signer-workflow "$SIGNER_WORKFLOW" \
            --signer-digest "$GITHUB_SHA" \
            --source-ref "$GITHUB_REF" \
            --source-digest "$GITHUB_SHA" \
            --deny-self-hosted-runners
      - name: Assemble immutable release payload
        id: payload
        env:
          ARTIFACT_DIR: ${{ github.workspace }}/formal-artifacts
          PAYLOAD_DIR: ${{ github.workspace }}/release-payload
          TARBALL: ${{ needs.build.outputs.tarball }}
          CHECKSUMS: ${{ needs.build.outputs.checksums }}
          SBOM: ${{ needs.build.outputs.sbom }}
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.sbom_attestation.outputs.bundle-path }}
        run: |
          set -euo pipefail
          mkdir "$PAYLOAD_DIR"
          cp "$ARTIFACT_DIR/$TARBALL" "$PAYLOAD_DIR/$TARBALL"
          cp "$ARTIFACT_DIR/$CHECKSUMS" "$PAYLOAD_DIR/$CHECKSUMS"
          cp "$ARTIFACT_DIR/$SBOM" "$PAYLOAD_DIR/$SBOM"
          cp "$ARTIFACT_DIR/release.json" "$PAYLOAD_DIR/release.json"
          cp "$PROVENANCE_BUNDLE" "$PAYLOAD_DIR/provenance.bundle.json"
          cp "$SBOM_BUNDLE" "$PAYLOAD_DIR/sbom.bundle.json"
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs'
          import { createHash } from 'node:crypto'
          import { join } from 'node:path'

          const hash = name => createHash('sha256')
            .update(readFileSync(join(process.env.PAYLOAD_DIR, name)))
            .digest('hex')
          appendFileSync(process.env.GITHUB_OUTPUT, [
            `provenance_bundle_sha256=${hash('provenance.bundle.json')}`,
            `sbom_bundle_sha256=${hash('sbom.bundle.json')}`,
            '',
          ].join('\n'))
          NODE
      - name: Upload the sole release payload
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ github.ref_name }}
          path: ${{ github.workspace }}/release-payload
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  stage_draft:
    needs: build_attest
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      artifact_id: ${{ needs.build_attest.outputs.artifact_id }}
      package_name: ${{ needs.build_attest.outputs.package_name }}
      version: ${{ needs.build_attest.outputs.version }}
      tag: ${{ needs.build_attest.outputs.tag }}
      tarball: ${{ needs.build_attest.outputs.tarball }}
      tarball_sha256: ${{ needs.build_attest.outputs.tarball_sha256 }}
      tarball_integrity: ${{ needs.build_attest.outputs.tarball_integrity }}
      checksums: ${{ needs.build_attest.outputs.checksums }}
      checksums_sha256: ${{ needs.build_attest.outputs.checksums_sha256 }}
      sbom: ${{ needs.build_attest.outputs.sbom }}
      sbom_sha256: ${{ needs.build_attest.outputs.sbom_sha256 }}
      descriptor_sha256: ${{ needs.build_attest.outputs.descriptor_sha256 }}
      provenance_bundle_sha256: ${{ needs.build_attest.outputs.provenance_bundle_sha256 }}
      sbom_bundle_sha256: ${{ needs.build_attest.outputs.sbom_bundle_sha256 }}
      release_id: ${{ steps.stage_release.outputs.release_id }}
    steps:
      - name: Reject release workflow reruns
        env:
          CURRENT_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          if [ "$CURRENT_RUN_ATTEMPT" != "1" ]; then
            echo 'release workflow reruns are not allowed; create a new RC tag' >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: release-source
          fetch-depth: 1
          persist-credentials: false
      - name: Download the attested payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build_attest.outputs.artifact_id }}
          path: ${{ github.workspace }}/release-payload
          merge-multiple: true
      - name: Verify the downloaded payload
        env:
          PAYLOAD_DIR: ${{ github.workspace }}/release-payload
          TARBALL: ${{ needs.build_attest.outputs.tarball }}
          TARBALL_SHA256: ${{ needs.build_attest.outputs.tarball_sha256 }}
          CHECKSUMS: ${{ needs.build_attest.outputs.checksums }}
          CHECKSUMS_SHA256: ${{ needs.build_attest.outputs.checksums_sha256 }}
          SBOM: ${{ needs.build_attest.outputs.sbom }}
          SBOM_SHA256: ${{ needs.build_attest.outputs.sbom_sha256 }}
          DESCRIPTOR_SHA256: ${{ needs.build_attest.outputs.descriptor_sha256 }}
          PROVENANCE_BUNDLE_SHA256: ${{ needs.build_attest.outputs.provenance_bundle_sha256 }}
          SBOM_BUNDLE_SHA256: ${{ needs.build_attest.outputs.sbom_bundle_sha256 }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, readdirSync } from 'node:fs'
          import { createHash } from 'node:crypto'
          import { join } from 'node:path'

          const expected = new Map([
            [process.env.TARBALL, process.env.TARBALL_SHA256],
            [process.env.CHECKSUMS, process.env.CHECKSUMS_SHA256],
            [process.env.SBOM, process.env.SBOM_SHA256],
            ['release.json', process.env.DESCRIPTOR_SHA256],
            ['provenance.bundle.json', process.env.PROVENANCE_BUNDLE_SHA256],
            ['sbom.bundle.json', process.env.SBOM_BUNDLE_SHA256],
          ])
          const actual = readdirSync(process.env.PAYLOAD_DIR).sort()
          const names = [...expected.keys()].sort()
          if (actual.length !== names.length || actual.some((name, index) => name !== names[index])) {
            throw new Error(`release payload is not exact: ${actual.join(', ')}`)
          }
          for (const [name, digest] of expected) {
            const actualDigest = createHash('sha256')
              .update(readFileSync(join(process.env.PAYLOAD_DIR, name)))
              .digest('hex')
            if (actualDigest !== digest) throw new Error(`release payload digest mismatch: ${name}`)
          }
          NODE
      - name: Create and verify the draft prerelease
        id: stage_release
        env:
          GH_TOKEN: ${{ github.token }}
          PAYLOAD_DIR: ${{ github.workspace }}/release-payload
          TAG: ${{ needs.build_attest.outputs.tag }}
          TARBALL: ${{ needs.build_attest.outputs.tarball }}
          TARBALL_SHA256: ${{ needs.build_attest.outputs.tarball_sha256 }}
          CHECKSUMS: ${{ needs.build_attest.outputs.checksums }}
          CHECKSUMS_SHA256: ${{ needs.build_attest.outputs.checksums_sha256 }}
          SBOM: ${{ needs.build_attest.outputs.sbom }}
          SBOM_SHA256: ${{ needs.build_attest.outputs.sbom_sha256 }}
          DESCRIPTOR_SHA256: ${{ needs.build_attest.outputs.descriptor_sha256 }}
          PROVENANCE_BUNDLE_SHA256: ${{ needs.build_attest.outputs.provenance_bundle_sha256 }}
          SBOM_BUNDLE_SHA256: ${{ needs.build_attest.outputs.sbom_bundle_sha256 }}
        run: |
          set -euo pipefail
          verify_release_tag() {
            local object_type object_sha depth
            read -r object_type object_sha < <(
              gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" \
                --jq '.object | [.type, .sha] | @tsv'
            )
            depth=0
            while [ "$object_type" = "tag" ]; do
              depth=$((depth + 1))
              if [ "$depth" -gt 16 ]; then
                echo 'release tag peel depth exceeded' >&2
                return 1
              fi
              read -r object_type object_sha < <(
                gh api "repos/$GITHUB_REPOSITORY/git/tags/$object_sha" \
                  --jq '.object | [.type, .sha] | @tsv'
              )
            done
            if [ "$object_type" != "commit" ] || [ "$object_sha" != "$GITHUB_SHA" ]; then
              echo 'release tag does not resolve to GITHUB_SHA' >&2
              return 1
            fi
          }
          verify_release_tag
          gh release create "$TAG" \
            "$PAYLOAD_DIR/$TARBALL" \
            "$PAYLOAD_DIR/$CHECKSUMS" \
            "$PAYLOAD_DIR/$SBOM" \
            "$PAYLOAD_DIR/release.json" \
            "$PAYLOAD_DIR/provenance.bundle.json" \
            "$PAYLOAD_DIR/sbom.bundle.json" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            --prerelease \
            --latest=false \
            --title "$TAG" \
            --notes "Release candidate $TAG"
          verify_release_tag
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --paginate \
            --slurp > "$RUNNER_TEMP/staged-releases.json"
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs'
          import { selectStagedDraftRelease } from './release-source/scripts/release-preview-lib.mjs'

          const pages = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/staged-releases.json`, 'utf8'))
          const release = selectStagedDraftRelease(pages, process.env.TAG)
          const expected = new Map([
            [process.env.TARBALL, process.env.TARBALL_SHA256],
            [process.env.CHECKSUMS, process.env.CHECKSUMS_SHA256],
            [process.env.SBOM, process.env.SBOM_SHA256],
            ['release.json', process.env.DESCRIPTOR_SHA256],
            ['provenance.bundle.json', process.env.PROVENANCE_BUNDLE_SHA256],
            ['sbom.bundle.json', process.env.SBOM_BUNDLE_SHA256],
          ])
          const assets = Array.isArray(release.assets) ? release.assets : []
          if (assets.length !== expected.size) throw new Error(`unexpected GitHub release asset count: ${assets.length}`)
          for (const asset of assets) {
            const digest = expected.get(asset.name)
            if (digest === undefined || asset.digest !== `sha256:${digest}`) {
              throw new Error(`GitHub release asset mismatch: ${String(asset.name)}`)
            }
            expected.delete(asset.name)
          }
          if (expected.size !== 0) throw new Error(`missing GitHub release assets: ${[...expected.keys()].join(', ')}`)
          if (!Number.isSafeInteger(release.id) || release.id <= 0) throw new Error('invalid staged GitHub release id')
          appendFileSync(process.env.GITHUB_OUTPUT, `release_id=${release.id}\n`)
          NODE

  publish_npm:
    needs: stage_draft
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      actions: read
      contents: write
      id-token: write
    outputs:
      release_id: ${{ needs.stage_draft.outputs.release_id }}
      tag: ${{ needs.stage_draft.outputs.tag }}
      tarball: ${{ needs.stage_draft.outputs.tarball }}
      tarball_sha256: ${{ needs.stage_draft.outputs.tarball_sha256 }}
      checksums: ${{ needs.stage_draft.outputs.checksums }}
      checksums_sha256: ${{ needs.stage_draft.outputs.checksums_sha256 }}
      sbom: ${{ needs.stage_draft.outputs.sbom }}
      sbom_sha256: ${{ needs.stage_draft.outputs.sbom_sha256 }}
      descriptor_sha256: ${{ needs.stage_draft.outputs.descriptor_sha256 }}
      provenance_bundle_sha256: ${{ needs.stage_draft.outputs.provenance_bundle_sha256 }}
      sbom_bundle_sha256: ${{ needs.stage_draft.outputs.sbom_bundle_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: release-source
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
      - name: Wait for earlier RC workflows
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_RUN_NUMBER: ${{ github.run_number }}
          CURRENT_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: node release-source/scripts/release-queue.mjs
      - name: Download the staged payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.stage_draft.outputs.artifact_id }}
          path: ${{ github.workspace }}/release-payload
          merge-multiple: true
      - name: Reverify the staged draft before npm publication
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.stage_draft.outputs.release_id }}
          TAG: ${{ needs.stage_draft.outputs.tag }}
          TARBALL: ${{ needs.stage_draft.outputs.tarball }}
          TARBALL_SHA256: ${{ needs.stage_draft.outputs.tarball_sha256 }}
          CHECKSUMS: ${{ needs.stage_draft.outputs.checksums }}
          CHECKSUMS_SHA256: ${{ needs.stage_draft.outputs.checksums_sha256 }}
          SBOM: ${{ needs.stage_draft.outputs.sbom }}
          SBOM_SHA256: ${{ needs.stage_draft.outputs.sbom_sha256 }}
          DESCRIPTOR_SHA256: ${{ needs.stage_draft.outputs.descriptor_sha256 }}
          PROVENANCE_BUNDLE_SHA256: ${{ needs.stage_draft.outputs.provenance_bundle_sha256 }}
          SBOM_BUNDLE_SHA256: ${{ needs.stage_draft.outputs.sbom_bundle_sha256 }}
        run: |
          set -euo pipefail
          verify_release_tag() {
            local object_type object_sha depth
            read -r object_type object_sha < <(
              gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" \
                --jq '.object | [.type, .sha] | @tsv'
            )
            depth=0
            while [ "$object_type" = "tag" ]; do
              depth=$((depth + 1))
              if [ "$depth" -gt 16 ]; then
                echo 'release tag peel depth exceeded' >&2
                return 1
              fi
              read -r object_type object_sha < <(
                gh api "repos/$GITHUB_REPOSITORY/git/tags/$object_sha" \
                  --jq '.object | [.type, .sha] | @tsv'
              )
            done
            if [ "$object_type" != "commit" ] || [ "$object_sha" != "$GITHUB_SHA" ]; then
              echo 'release tag does not resolve to GITHUB_SHA' >&2
              return 1
            fi
          }
          verify_release_tag
          node --input-type=module <<'NODE'
          const releaseId = Number(process.env.RELEASE_ID)
          if (!Number.isSafeInteger(releaseId) || releaseId <= 0) throw new Error('invalid staged release id')
          const response = await fetch(
            `https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/releases/${releaseId}`,
            {
              headers: {
                accept: 'application/vnd.github+json',
                authorization: `Bearer ${process.env.GH_TOKEN}`,
                'x-github-api-version': '2022-11-28',
              },
            },
          )
          if (!response.ok) throw new Error(`staged release lookup returned ${response.status}`)
          const release = await response.json()
          if (
            release.id !== releaseId
            || release.tag_name !== process.env.TAG
            || release.draft !== true
            || release.prerelease !== true
          ) throw new Error('staged draft changed before npm publish')
          const expected = new Map([
            [process.env.TARBALL, process.env.TARBALL_SHA256],
            [process.env.CHECKSUMS, process.env.CHECKSUMS_SHA256],
            [process.env.SBOM, process.env.SBOM_SHA256],
            ['release.json', process.env.DESCRIPTOR_SHA256],
            ['provenance.bundle.json', process.env.PROVENANCE_BUNDLE_SHA256],
            ['sbom.bundle.json', process.env.SBOM_BUNDLE_SHA256],
          ])
          const assets = Array.isArray(release.assets) ? release.assets : []
          if (assets.length !== expected.size) throw new Error('staged asset count changed before npm publish')
          for (const asset of assets) {
            const digest = expected.get(asset.name)
            if (digest === undefined || asset.digest !== `sha256:${digest}`) {
              throw new Error(`staged asset changed before npm publish: ${String(asset.name)}`)
            }
            expected.delete(asset.name)
          }
          if (expected.size !== 0) throw new Error('staged assets are incomplete before npm publish')
          NODE
      - name: Pin npm
        run: npm install --global npm@11.16.0
      - name: Verify payload and registry preconditions
        id: registry_before
        env:
          PAYLOAD_DIR: ${{ github.workspace }}/release-payload
          PACKAGE_NAME: ${{ needs.stage_draft.outputs.package_name }}
          VERSION: ${{ needs.stage_draft.outputs.version }}
          TARBALL: ${{ needs.stage_draft.outputs.tarball }}
          TARBALL_SHA256: ${{ needs.stage_draft.outputs.tarball_sha256 }}
          DESCRIPTOR_SHA256: ${{ needs.stage_draft.outputs.descriptor_sha256 }}
          NPM_AUTH_MODE: ${{ vars.NPM_AUTH_MODE }}
          GIT_SHA: ${{ github.sha }}
          BOOTSTRAP_GIT_SHA: ${{ vars.NPM_BOOTSTRAP_GIT_SHA }}
          RELEASE_SOURCE_DIR: ${{ github.workspace }}/release-source
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs'
          import { createHash } from 'node:crypto'
          import { join } from 'node:path'
          import { pathToFileURL } from 'node:url'

          const { assertNpmNextAdvances } = await import(pathToFileURL(
            join(process.env.RELEASE_SOURCE_DIR, 'scripts/release-preview-lib.mjs'),
          ).href)

          if (!['bootstrap', 'oidc'].includes(process.env.NPM_AUTH_MODE)) {
            throw new Error('NPM_AUTH_MODE must be bootstrap or oidc')
          }
          const hash = name => createHash('sha256')
            .update(readFileSync(join(process.env.PAYLOAD_DIR, name)))
            .digest('hex')
          if (hash(process.env.TARBALL) !== process.env.TARBALL_SHA256) throw new Error('npm tarball digest mismatch')
          if (hash('release.json') !== process.env.DESCRIPTOR_SHA256) throw new Error('npm descriptor digest mismatch')

          const packageUrl = `https://registry.npmjs.org/${encodeURIComponent(process.env.PACKAGE_NAME)}`
          const response = await fetch(packageUrl, {
            cache: 'no-store',
            headers: { accept: 'application/json', 'cache-control': 'no-cache' },
          })
          let latest = '__absent__'
          if (process.env.NPM_AUTH_MODE === 'bootstrap') {
            if (!/^[a-f0-9]{40}$/u.test(process.env.BOOTSTRAP_GIT_SHA ?? '')) {
              throw new Error('NPM_BOOTSTRAP_GIT_SHA must pin the authorized bootstrap commit')
            }
            if (process.env.BOOTSTRAP_GIT_SHA !== process.env.GIT_SHA) {
              throw new Error('bootstrap commit does not match NPM_BOOTSTRAP_GIT_SHA')
            }
            if (response.status !== 404) throw new Error('bootstrap is only allowed before the package exists')
          } else {
            if (response.status === 404) throw new Error('OIDC publishing requires an existing package')
            if (!response.ok) throw new Error(`npm registry preflight returned ${response.status}`)
            const metadata = await response.json()
            if (metadata.versions?.[process.env.VERSION] !== undefined) {
              throw new Error(`${process.env.PACKAGE_NAME}@${process.env.VERSION} already exists`)
            }
            assertNpmNextAdvances(
              process.env.PACKAGE_NAME,
              process.env.VERSION,
              metadata['dist-tags']?.next,
            )
            if (typeof metadata['dist-tags']?.latest === 'string') latest = metadata['dist-tags'].latest
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `latest=${latest}\n`)
          NODE
      - name: Publish the bootstrap RC with a temporary token
        if: vars.NPM_AUTH_MODE == 'bootstrap'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TGZ: ${{ github.workspace }}/release-payload/${{ needs.stage_draft.outputs.tarball }}
        run: |
          set -euo pipefail
          test -n "$NODE_AUTH_TOKEN"
          export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/npmrc-bootstrap"
          printf '%s\n' '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}' > "$NPM_CONFIG_USERCONFIG"
          npm publish "$TGZ" --tag next --access public --provenance
      - name: Publish the RC with Trusted Publishing
        if: vars.NPM_AUTH_MODE == 'oidc'
        env:
          TGZ: ${{ github.workspace }}/release-payload/${{ needs.stage_draft.outputs.tarball }}
        run: env -u NODE_AUTH_TOKEN -u NPM_TOKEN npm publish "$TGZ" --tag next --access public --provenance
      - name: Verify the published registry tarball and dist-tags
        env:
          PACKAGE_NAME: ${{ needs.stage_draft.outputs.package_name }}
          VERSION: ${{ needs.stage_draft.outputs.version }}
          TARBALL_INTEGRITY: ${{ needs.stage_draft.outputs.tarball_integrity }}
          TARBALL_SHA256: ${{ needs.stage_draft.outputs.tarball_sha256 }}
          LATEST_BEFORE: ${{ steps.registry_before.outputs.latest }}
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto'
          import { setTimeout as delay } from 'node:timers/promises'

          const encodedName = encodeURIComponent(process.env.PACKAGE_NAME)
          const versionUrl = `https://registry.npmjs.org/${encodedName}/${encodeURIComponent(process.env.VERSION)}`
          let versionMetadata
          for (let attempt = 0; attempt < 6; attempt += 1) {
            const response = await fetch(versionUrl, {
              cache: 'no-store',
              headers: { accept: 'application/json', 'cache-control': 'no-cache' },
            })
            if (response.ok) {
              const candidate = await response.json()
              if (candidate.dist?.attestations?.provenance?.predicateType === 'https://slsa.dev/provenance/v1') {
                versionMetadata = candidate
                break
              }
              if (attempt === 5) throw new Error('npm registry provenance descriptor is missing')
              await delay(5_000)
              continue
            }
            if (response.status !== 404 || attempt === 5) {
              throw new Error(`npm registry version verification returned ${response.status}`)
            }
            await delay(5_000)
          }
          if (versionMetadata?.dist?.integrity !== process.env.TARBALL_INTEGRITY) {
            throw new Error('npm registry integrity mismatch')
          }
          const tarballResponse = await fetch(versionMetadata.dist.tarball)
          if (!tarballResponse.ok) throw new Error(`npm tarball download returned ${tarballResponse.status}`)
          const tarball = Buffer.from(await tarballResponse.arrayBuffer())
          const tarballHash = createHash('sha256').update(tarball).digest('hex')
          if (tarballHash !== process.env.TARBALL_SHA256) throw new Error('npm tarball SHA-256 mismatch')

          const packageResponse = await fetch(`https://registry.npmjs.org/${encodedName}`, {
            cache: 'no-store',
            headers: { accept: 'application/json', 'cache-control': 'no-cache' },
          })
          if (!packageResponse.ok) throw new Error(`npm registry package verification returned ${packageResponse.status}`)
          const packageMetadata = await packageResponse.json()
          if (packageMetadata['dist-tags']?.next !== process.env.VERSION) throw new Error('npm next tag mismatch')
          const latestAfter = typeof packageMetadata['dist-tags']?.latest === 'string'
            ? packageMetadata['dist-tags'].latest
            : '__absent__'
          if (latestAfter !== process.env.LATEST_BEFORE) throw new Error('npm latest tag changed')
          NODE
      - name: Verify npm provenance signature and workflow identity
        env:
          PACKAGE_NAME: ${{ needs.stage_draft.outputs.package_name }}
          VERSION: ${{ needs.stage_draft.outputs.version }}
          TARBALL_INTEGRITY: ${{ needs.stage_draft.outputs.tarball_integrity }}
          TARBALL: ${{ github.workspace }}/release-payload/${{ needs.stage_draft.outputs.tarball }}
          SIGNER_WORKFLOW: ${{ github.repository }}/.github/workflows/release.yml
        run: |
          set -euo pipefail
          PROVENANCE_DIR="$RUNNER_TEMP/npm-provenance"
          mkdir "$PROVENANCE_DIR"
          cd "$PROVENANCE_DIR"
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs'

          writeFileSync('package.json', `${JSON.stringify({
            private: true,
            dependencies: { [process.env.PACKAGE_NAME]: process.env.VERSION },
          }, null, 2)}\n`)
          NODE
          env -u NODE_AUTH_TOKEN -u NPM_TOKEN npm_config_prefer_online=true npm install --ignore-scripts --no-audit --no-fund --save-exact
          for attempt in 1 2 3 4 5 6; do
            if env -u NODE_AUTH_TOKEN -u NPM_TOKEN npm_config_prefer_online=true npm audit signatures --json --include-attestations > npm-signatures.json; then
              break
            fi
            if [ "$attempt" -eq 6 ]; then
              exit 1
            fi
            sleep 5
          done
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'

          const report = JSON.parse(readFileSync('npm-signatures.json', 'utf8'))
          const record = report.verified?.find(item => (
            item.name === process.env.PACKAGE_NAME && item.version === process.env.VERSION
          ))
          if (record === undefined) throw new Error('npm did not cryptographically verify the released package')
          if (record.attestations?.provenance?.predicateType !== 'https://slsa.dev/provenance/v1') {
            throw new Error('npm registry provenance descriptor is missing')
          }
          const provenance = record.attestationBundles?.find(attestation => (
            attestation.predicateType === 'https://slsa.dev/provenance/v1'
          ))
          if (provenance === undefined) throw new Error('npm SLSA provenance bundle is missing')
          if (provenance.bundle === null || typeof provenance.bundle !== 'object') {
            throw new Error('npm SLSA provenance bundle is invalid')
          }
          const payload = provenance.bundle?.dsseEnvelope?.payload
          if (typeof payload !== 'string') throw new Error('npm provenance payload is invalid')
          const statement = JSON.parse(Buffer.from(payload, 'base64').toString('utf8'))
          if (statement.predicateType !== 'https://slsa.dev/provenance/v1') {
            throw new Error('npm provenance predicate type mismatch')
          }
          if (!process.env.TARBALL_INTEGRITY.startsWith('sha512-')) {
            throw new Error('release tarball integrity is not SHA-512')
          }
          const expectedSha512 = Buffer.from(process.env.TARBALL_INTEGRITY.slice(7), 'base64').toString('hex')
          if (!statement.subject?.some(subject => subject.digest?.sha512 === expectedSha512)) {
            throw new Error('npm provenance subject digest mismatch')
          }

          const workflow = statement.predicate?.buildDefinition?.externalParameters?.workflow
          const expectedRepository = `https://github.com/${process.env.GITHUB_REPOSITORY}`
          if (
            workflow?.repository !== expectedRepository
            || workflow?.path !== '.github/workflows/release.yml'
            || workflow?.ref !== process.env.GITHUB_REF
          ) throw new Error('npm provenance workflow identity mismatch')
          const dependencies = statement.predicate?.buildDefinition?.resolvedDependencies
          const expectedUri = `git+${expectedRepository}@${process.env.GITHUB_REF}`
          if (!dependencies?.some(dependency => (
            dependency.uri === expectedUri && dependency.digest?.gitCommit === process.env.GITHUB_SHA
          ))) throw new Error('npm provenance source digest mismatch')
          if (statement.predicate?.buildDefinition?.internalParameters?.github?.event_name !== 'push') {
            throw new Error('npm provenance event mismatch')
          }
          if (statement.predicate?.runDetails?.builder?.id !== 'https://github.com/actions/runner/github-hosted') {
            throw new Error('npm provenance builder mismatch')
          }
          writeFileSync('npm-provenance.bundle.json', `${JSON.stringify(provenance.bundle)}\n`, { mode: 0o600 })
          NODE
          gh attestation verify "$TARBALL" \
            --repo "$GITHUB_REPOSITORY" \
            --bundle npm-provenance.bundle.json \
            --digest-alg sha512 \
            --signer-workflow "$SIGNER_WORKFLOW" \
            --signer-digest "$GITHUB_SHA" \
            --source-ref "$GITHUB_REF" \
            --source-digest "$GITHUB_SHA" \
            --deny-self-hosted-runners

  finalize_release:
    needs: publish_npm
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Reject release workflow reruns
        env:
          CURRENT_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          if [ "$CURRENT_RUN_ATTEMPT" != "1" ]; then
            echo 'release workflow reruns are not allowed; create a new RC tag' >&2
            exit 1
          fi
      - name: Publish the verified GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.publish_npm.outputs.release_id }}
          TAG: ${{ needs.publish_npm.outputs.tag }}
          TARBALL: ${{ needs.publish_npm.outputs.tarball }}
          TARBALL_SHA256: ${{ needs.publish_npm.outputs.tarball_sha256 }}
          CHECKSUMS: ${{ needs.publish_npm.outputs.checksums }}
          CHECKSUMS_SHA256: ${{ needs.publish_npm.outputs.checksums_sha256 }}
          SBOM: ${{ needs.publish_npm.outputs.sbom }}
          SBOM_SHA256: ${{ needs.publish_npm.outputs.sbom_sha256 }}
          DESCRIPTOR_SHA256: ${{ needs.publish_npm.outputs.descriptor_sha256 }}
          PROVENANCE_BUNDLE_SHA256: ${{ needs.publish_npm.outputs.provenance_bundle_sha256 }}
          SBOM_BUNDLE_SHA256: ${{ needs.publish_npm.outputs.sbom_bundle_sha256 }}
        run: |
          set -euo pipefail
          verify_release_tag() {
            local object_type object_sha depth
            read -r object_type object_sha < <(
              gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" \
                --jq '.object | [.type, .sha] | @tsv'
            )
            depth=0
            while [ "$object_type" = "tag" ]; do
              depth=$((depth + 1))
              if [ "$depth" -gt 16 ]; then
                echo 'release tag peel depth exceeded' >&2
                return 1
              fi
              read -r object_type object_sha < <(
                gh api "repos/$GITHUB_REPOSITORY/git/tags/$object_sha" \
                  --jq '.object | [.type, .sha] | @tsv'
              )
            done
            if [ "$object_type" != "commit" ] || [ "$object_sha" != "$GITHUB_SHA" ]; then
              echo 'release tag does not resolve to GITHUB_SHA' >&2
              return 1
            fi
          }
          verify_release_tag
          node --input-type=module <<'NODE'
          const releaseId = Number(process.env.RELEASE_ID)
          if (!Number.isSafeInteger(releaseId) || releaseId <= 0) throw new Error('invalid staged release id')
          const expectedAssets = () => new Map([
            [process.env.TARBALL, process.env.TARBALL_SHA256],
            [process.env.CHECKSUMS, process.env.CHECKSUMS_SHA256],
            [process.env.SBOM, process.env.SBOM_SHA256],
            ['release.json', process.env.DESCRIPTOR_SHA256],
            ['provenance.bundle.json', process.env.PROVENANCE_BUNDLE_SHA256],
            ['sbom.bundle.json', process.env.SBOM_BUNDLE_SHA256],
          ])
          const url = `https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/releases/${releaseId}`
          const headers = {
            accept: 'application/vnd.github+json',
            authorization: `Bearer ${process.env.GH_TOKEN}`,
            'x-github-api-version': '2022-11-28',
          }
          const validateRelease = (release, expectedDraft) => {
            if (
              release.id !== releaseId
              || release.tag_name !== process.env.TAG
              || release.draft !== expectedDraft
              || release.prerelease !== true
            ) throw new Error('GitHub release identity or state mismatch')
            const expected = expectedAssets()
            const assets = Array.isArray(release.assets) ? release.assets : []
            if (assets.length !== expected.size) throw new Error('GitHub release asset count changed')
            for (const asset of assets) {
              const digest = expected.get(asset.name)
              if (digest === undefined || asset.digest !== `sha256:${digest}`) {
                throw new Error(`GitHub release asset changed: ${String(asset.name)}`)
              }
              expected.delete(asset.name)
            }
            if (expected.size !== 0) throw new Error('GitHub release assets are incomplete')
          }

          const stagedResponse = await fetch(url, { headers })
          if (!stagedResponse.ok) throw new Error(`staged release lookup returned ${stagedResponse.status}`)
          validateRelease(await stagedResponse.json(), true)

          const publishResponse = await fetch(url, {
            method: 'PATCH',
            headers: { ...headers, 'content-type': 'application/json' },
            body: JSON.stringify({ draft: false, prerelease: true, make_latest: 'false' }),
          })
          if (!publishResponse.ok) throw new Error(`release publish returned ${publishResponse.status}`)
          validateRelease(await publishResponse.json(), false)
          NODE
