name: Release preview gate

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:

jobs:
  release-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: dsh-feishu-bot
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: deepseek-ai/deepseek-harness
          ref: 0a53fb55bea101816fa226bb964ae2bed71c343b
          path: deepseek-harness
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: corepack enable
      - run: corepack prepare pnpm@11.18.0 --activate
      - run: pnpm install --frozen-lockfile
        working-directory: deepseek-harness
      - run: pnpm build:lib:host
        working-directory: deepseek-harness
      - run: pnpm release:preview
        working-directory: dsh-feishu-bot
        env:
          DSH_RELEASE_HARNESS_ROOT: ${{ github.workspace }}/deepseek-harness
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dsh-feishu-bot-preview
          path: |
            dsh-feishu-bot/artifacts/*.tgz
            dsh-feishu-bot/artifacts/SHA256SUMS
