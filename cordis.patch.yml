# The dsh-feishu-bot bundle patch: three plugin rows inserted after the web-app
# layer. feishu-gateway provides the `ctx.feishu` transport service;
# feishu-bridge owns all business semantics (bindings, commands, inbound
# dedup, outbound projection, approval answering); feishu-invariant enforces
# active binding -> live/persisted session existence.
#
# Credentials are credential references resolved by the dsh credentials
# service; no secrets live in this file or this repository.
#
# Deployment values (your open_id allowlist and workspace roots) belong in
# your profile's own patch layer (~/.dsh/profiles/<name>/cordis.patch.yml),
# which applies after this bundle layer:
#
#   - id: feishu-bridge
#     config:
#       allowedOpenIds: [ou_your_open_id]
#       allowedWorkspaces: [~/your/workspace/root]
#       defaultWorkspace: ~/your/workspace/root
#
# The defaults below are fail-closed: an empty allowlist rejects every
# sender and an empty workspace list rejects every /new.

- insert:
    - id: feishu-gateway
      name: 'dsh-feishu-bot/gateway'
      config:
        appIdRef: FEISHU_APP_ID
        appSecretRef: FEISHU_APP_SECRET

    - id: feishu-bridge
      name: 'dsh-feishu-bot/bridge'
      config:
        allowedOpenIds: []
        allowedWorkspaces: []
        freshnessMs: 600000
        listingTtlMs: 300000
        cardThrottleMs: 1000

    - id: feishu-invariant
      name: 'dsh-feishu-bot/invariant'
